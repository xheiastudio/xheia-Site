<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 7" shape-rendering="crispEdges">
  <!-- Simplified, filled PixelMark for legibility at 16px (BRANDFINAL §4 notes the
       full outline mark isn't crisp at true favicon size). Colors follow the brand's
       dark/light mode rules via prefers-color-scheme since a favicon can't read the
       page's data-theme attribute. -->
  <rect class="bg" x="0" y="0" width="7" height="7" />
  <g class="mark">
    <rect x="3" y="0" width="1" height="1" />
    <rect x="2" y="1" width="3" height="1" />
    <rect x="1" y="2" width="5" height="1" />
    <rect x="0" y="3" width="3" height="1" />
    <rect x="4" y="3" width="3" height="1" />
    <rect x="1" y="4" width="5" height="1" />
    <rect x="2" y="5" width="3" height="1" />
    <rect x="3" y="6" width="1" height="1" />
  </g>
  <rect class="pupil" x="3" y="3" width="1" height="1" />
  <style>
    .bg { fill: #0d0d10; }
    .mark { fill: #3ef07c; }
    .pupil { fill: #3e6bf0; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f2f0ea; }
      .mark { fill: #0d0d10; }
    }
  </style>
</svg>
